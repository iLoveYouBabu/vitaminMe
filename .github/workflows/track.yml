name: Collect Melon Chart

on:
  # Actions 화면에서 직접 실행할 수 있게 함
  workflow_dispatch:

  # 매시간 7분에 자동 실행 --> 3분으로 변경 --> 1,6분마다 실행되도록 변경
  #schedule:
  #  - cron: "1-59/5 * * * *"

permissions:
  contents: write

concurrency:
  group: melon-chart-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest

    steps:
      - name: 저장소 파일 가져오기
        uses: actions/checkout@v4

      - name: Python 준비
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 멜론 순위 수집
        run: python track.py

      - name: 변경된 JSON 저장
        run: |
          if git diff --quiet; then
            echo "변경된 데이터가 없습니다."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add docs/data/chart.json
          git commit -m "Update Melon chart data"
          git push
